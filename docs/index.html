  --navy:#0b0b0c; --navy-ink:#f7f5ef; --red:#e2401f;
  --ok:#1f8a52; --ok-soft:#e1f4ea; --due:#c2410c; --due-soft:#fdeadf; --late:#b42318; --late-soft:#fde4e2;
  --font-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1222; --surface:#171c31; --surface-2:#20263f; --line:#2c3352;
  --ink:#eef0f8; --ink-2:#a2a8c4; --gold:#e8b23a; --gold-soft:#3a2f12; --gold-ink:#f5d78a;
  --navy:#050506; --navy-ink:#f7f5ef; --red:#f0532f;
  --ok:#4cc98a; --ok-soft:#163a2a; --due:#f59e5b; --due-soft:#3d2615; --late:#f87171; --late-soft:#3d1b1b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#171c31; --surface-2:#20263f; --line:#2c3352;
  --ink:#eef0f8; --ink-2:#a2a8c4; --gold:#e8b23a; --gold-soft:#3a2f12; --gold-ink:#f5d78a;
  --navy:#050506; --navy-ink:#f7f5ef; --red:#f0532f;
  --ok:#4cc98a; --ok-soft:#163a2a; --due:#f59e5b; --due-soft:#3d2615; --late:#f87171; --late-soft:#3d1b1b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* brand band */
.brand{background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--red)}
.brand .wrap{padding-block:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.coin{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a3,#e0a521 55%,#9c6a06);display:grid;place-items:center;color:#4a3200;font-family:var(--font-display);font-size:22px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.logo img{width:130px;height:130px;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo small{font-size:13px}
@media (max-width:520px){.brand .wrap{flex-direction:column;align-items:center;text-align:center}.logo{flex-direction:column;gap:2px}.logo img{width:150px;height:150px}}
.logo h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.5px;line-height:1.1}
.logo small{display:block;font-size:12px;opacity:.75;letter-spacing:.3px}
.social{display:flex;gap:8px}
.social a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--navy-ink);text-decoration:none;font-size:13px;font-weight:600}
.social a:hover{background:rgba(255,255,255,.18)}
.social svg{width:16px;height:16px}

main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}

/* balance tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600}
.tile .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-word}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.tile.t-due .val{color:var(--due)} .tile.t-ok .val{color:var(--ok)} .tile.t-owe .val{color:var(--late)}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile.t-net{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tile.t-net .lbl,.tile.t-net .sub{color:var(--navy-ink);opacity:.8}
.tile.t-net .val{font-size:16px}
@media (max-width:700px){.tiles{grid-template-columns:1fr 1fr}}
.dir{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dir button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:700;font-size:16px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
.dir button small{font-weight:500;font-size:12px}
.dir button[aria-pressed="true"][data-dir="orders"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dir button[aria-pressed="true"][data-dir="debts"]{border-color:var(--late);background:var(--late-soft);color:var(--late)}
.dir button[aria-pressed="true"][data-dir="deposits"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
@media (max-width:420px){.dir button{font-size:14px;padding:10px 4px}.dir button small{font-size:11px}}
.tag.held{background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.payrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--ok-soft);border-radius:10px;padding:8px}
.payrow input{width:auto;flex:1 1 110px;min-width:0;padding:7px 9px}
.payrow .btn{padding:7px 12px}
.tag.part{background:var(--ok-soft);color:var(--ok);font-weight:700}
.net{font-weight:700}.net.plus{color:var(--ok)}.net.minus{color:var(--late)}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:999px;width:fit-content;max-width:100%}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tab{white-space:nowrap;flex:0 0 auto}
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
@media (max-width:440px){.tab{padding:8px 10px;font-size:14px}}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab .count.k{background:var(--surface-2);color:var(--ink-2)}
.contact-stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.picked{font-size:12.5px;color:var(--ok);font-weight:600}
.tab .count{font-size:12px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .search{flex:1 1 200px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:42px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:start;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.cat b{font-size:14px}.cat span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.cat[aria-pressed="true"] span{color:var(--gold-ink)}
.tag.k-trader{background:var(--surface-2);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.tag.k-team{background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn-gold{background:var(--gold);color:#241800}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-danger{background:var(--late);color:#fff}

/* form */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.form h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.money{display:flex;gap:6px}.money input{flex:1;min-width:0}.money select{width:auto;flex:0 0 auto}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"].s-done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].s-wait{background:var(--due-soft);border-color:var(--due);color:var(--due)}
.form .actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

/* entries */
.list{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.entry.late{border-color:var(--late)}
.entry .who{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.entry .what{color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.entry .amt{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag.late{background:var(--late-soft);color:var(--late);font-weight:700}
.tag.today{background:var(--due-soft);color:var(--due);font-weight:700}
.note{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.row-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.pill{border:0;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--due-soft);color:var(--due)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.link{background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:13.5px;padding:6px 8px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.link:hover{background:var(--surface-2);color:var(--ink)}
.link.wa{color:var(--ok)}
.spacer{flex:1}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13.5px}
.confirm .btn{padding:5px 10px;font-size:13px}

.empty{text-align:center;padding:34px 16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink-2)}
.empty .elogo{margin:0 auto 10px;width:64px;height:64px;border-radius:12px;display:block}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

      <div class="tile t-net"><div class="lbl">الجرد الصافي</div><div class="val" id="sumNet">خالصين</div><div class="sub" id="sumNetSub">اللي انقبض ناقص كل اللي عليك</div></div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-orders" aria-selected="true" data-tab="orders">بدي من الناس <span class="count" id="cntOrders">0</span></button>
      <button class="tab" role="tab" id="tab-debts" aria-selected="false" data-tab="debts">بدهم مني <span class="count" id="cntDebts">0</span></button>
      <button class="tab" role="tab" id="tab-deposits" aria-selected="false" data-tab="deposits">الحجوزات <span class="count k" id="cntDeposits">0</span></button>
      <button class="tab" role="tab" id="tab-contacts" aria-selected="false" data-tab="contacts">الأسماء <span class="count k" id="cntContacts">0</span></button>
      <button class="tab" role="tab" id="tab-receipts" aria-selected="false" data-tab="receipts">الاستلامات <span class="count k" id="cntReceipts">0</span></button>
    </div>

    <div class="bar">
      <input class="search" id="q" type="search" placeholder="دوّر على اسم، رقم، خدمة…" aria-label="بحث">
      <div class="filters" id="filters" role="group" aria-label="فلتر الحالة">
        <button class="chip" data-f="all" aria-pressed="true">الكل</button>
        <button class="chip" data-f="wait" aria-pressed="false">لسى</button>
        <button class="chip" data-f="late" aria-pressed="false">متأخر</button>
        <button class="chip" data-f="done" aria-pressed="false">تم</button>
      </div>
      <button class="btn btn-gold" id="addBtn">+ طلب جديد</button>
    </div>
    <div class="cats" id="cats" role="group" aria-label="القائمة"></div>

    <form class="form" id="form" hidden autocomplete="off">
      <h2 id="formTitle">قيد جديد</h2>
      <div class="dir" id="dirRow" role="group" aria-label="نوع القيد">
        <button type="button" data-dir="orders" aria-pressed="true">بدي منه<small>هو لازم يدفعلي</small></button>
        <button type="button" data-dir="debts" aria-pressed="false">بدو مني<small>أنا لازم أدفعله</small></button>
        <button type="button" data-dir="deposits" aria-pressed="false">استلمت حجز<small>عربون قبل التسليم</small></button>
      </div>
      <div class="grid">
        <div class="field"><label for="f-name" id="l-name">اسم الزبون</label><input id="f-name" list="people" required><datalist id="people"></datalist><span class="picked" id="picked" hidden></span></div>
        <div class="field"><label for="f-kind" id="l-kind">القائمة</label>
          <select id="f-kind"><option value="customer">زبون عادي</option><option value="trader">تاجر</option><option value="team">MOHPTON TEAM</option></select></div>
        <div class="field"><label for="f-phone" id="l-phone">رقم الجوال</label><input id="f-phone" type="tel" inputmode="tel" placeholder="059xxxxxxx" dir="ltr"></div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" inputmode="email" placeholder="name@gmail.com" dir="ltr" autocapitalize="off"></div>
        <div class="field"><label for="f-igg">IGG ID</label><input id="f-igg" inputmode="numeric" placeholder="رقم حساب الفاتحون" dir="ltr"></div>
        <div class="field orders-only"><label for="f-service">الخدمة / اللعبة</label>
          <input id="f-service" list="services" placeholder="مثلاً: شدات ببجي 660 UC">
          <datalist id="services">
            <option value="شدات ببجي UC"><option value="نقاط كول أوف ديوتي CP"><option value="جواهر فري فاير Diamonds">
            <option value="Credits & Coins"><option value="Game Pack"><option value="بطاقة PlayStation Store">
            <option value="بطاقة iTunes"><option value="Steam"><option value="Epic Games"><option value="Netflix">
            <option value="Shahid"><option value="حساب ببجي موبايل"><option value="قلعة الفاتحون"><option value="بوتات / خدمات الفاتحون">
            <option value="شراء من موقع أجنبي">
          </datalist></div>
        <div class="field orders-only"><label for="f-platform">المنصة</label>
          <select id="f-platform"><option value="">—</option><option>Mobile</option><option>PC</option><option>PS4 / PS5</option><option>اشتراك / أونلاين</option></select></div>
        <div class="field orders-only"><label for="f-gid">ID اللاعب / الحساب</label><input id="f-gid" dir="ltr"></div>
        <div class="field debts-only" hidden><label for="f-reason" id="l-reason">على شو؟</label><input id="f-reason" placeholder="مثلاً: بطاقات ستيم، شدات بالجملة"></div>
        <div class="field money-only"><label for="f-amount">المبلغ</label>
          <div class="money"><input id="f-amount" type="number" inputmode="decimal" min="0" step="any" required>
            <select id="f-cur" aria-label="العملة"><option value="₪">₪ شيكل</option><option value="$">$ دولار</option><option value="جنيه">جنيه</option></select></div></div>
        <div class="field money-only"><label for="f-date" id="l-date">تاريخ الطلب</label><input id="f-date" type="date"></div>
        <div class="field money-only nodep"><label for="f-due" id="l-due">موعد الدفع اللي وعد فيه</label><input id="f-due" type="date"></div>
        <div class="field money-only"><label id="l-status">الدفع</label>
          <div class="seg" role="group" aria-labelledby="l-status">
            <button type="button" class="s-wait" data-s="wait" aria-pressed="true">لسى</button>
            <button type="button" class="s-done" data-s="done" aria-pressed="false">تم</button>
          </div></div>
        <div class="field full"><label for="f-note">ملاحظات</label><textarea id="f-note" rows="2"></textarea></div>
      </div>
      <div class="actions">
        <button class="btn btn-gold" type="submit" id="saveBtn">حفظ</button>
        <button class="btn btn-ghost" type="button" id="cancelBtn">إلغاء</button>
      </div>
    </form>

    <section class="list" id="list" aria-live="polite"></section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const KINDS = {customer:"زبون عادي", trader:"تاجر", team:"MOHPTON TEAM"};
  const kindOf = x => KINDS[x.kind] ? x.kind : "customer";
  const LOGO = (document.querySelector(".logo img")||{}).src||"";
  const state = { deposits:[], fromDeposit:null, confirmRet:null, contacts:[], tab:"orders", filter:"all", cat:"all", q:"", orders:[], debts:[], editing:null, status:"wait", confirmDel:null, mode:"loading" };
  let db = null;

  const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${+d}/${+m}/${y}`; };
  const fmtMoney = (n,c) => { const v=(Math.round((+n||0)*100)/100).toLocaleString("en-US"); return c==="$" ? `$${v}` : `${v} ${c||"₪"}`; };
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
  function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800); }

  // ----- storage: db when available, browser storage as fallback -----
  const LS = "tc-ledger-v1";
  function lsLoad(){ try{ const d=JSON.parse(localStorage.getItem(LS)||"{}"); state.orders=d.orders||[]; state.debts=d.debts||[]; state.contacts=d.contacts||[]; state.deposits=d.deposits||[]; }catch(e){} }
  function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({orders:state.orders, debts:state.debts, contacts:state.contacts, deposits:state.deposits})); }catch(e){} }

  async function put(coll, item){
    const body = {...item}; delete body.id;
    if(db){ await db.collection(coll).doc(item.id).set(body); }
    else { const arr=state[coll]; const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); lsSave(); render(); }
  }
  async function remove(coll, id){
    if(db){ await db.collection(coll).doc(id).delete(); }
    else { state[coll]=state[coll].filter(x=>x.id!==id); lsSave(); render(); }
  }
  function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  async function init(){
    render();
    try{ db = window.claude && await window.claude.use("db"); }catch(e){ db=null; }
    if(db){
      state.mode="db";
      ["orders","debts","contacts","deposits"].forEach(coll=>{
        db.collection(coll).onSnapshot(snap=>{
          state[coll]=snap.docs.map(d=>({id:d.id, ...d.data()}));
          render();
        }, err=>{ showNotice("صار خلل بالاتصال. حدّث الصفحة."); });
      });
    } else {
      state.mode="local"; lsLoad();
      const inClaude = /claude\.ai|claudeusercontent/.test(location.hostname) || !!window.claude;
      showNotice(inClaude
        ? "الحفظ هلق على هذا الجهاز بس. افتح الرابط وانت مسجّل دخول على Claude عشان تنحفظ البيانات وتشوفها من أي جهاز."
        : "هاي النسخة بتحفظ البيانات على هاد الجهاز وهاد المتصفح بس. نزّل نسخة احتياطية كل فترة عشان ما تضيع.");
      $("#backup").hidden = inClaude;
      render();
    }
  }
  $("#exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify({orders:state.orders, debts:state.debts, contacts:state.contacts, deposits:state.deposits, savedAt:new Date().toISOString()}, null, 1)], {type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`target-coins-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000); toast("انتزلت النسخة ✓");
  });
  $("#importFile").addEventListener("change", async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text());
      if(!Array.isArray(d.orders)||!Array.isArray(d.debts)) throw 0;
      state.orders=d.orders; state.debts=d.debts; state.contacts=Array.isArray(d.contacts)?d.contacts:[]; state.deposits=Array.isArray(d.deposits)?d.deposits:[];
      lsSave(); render(); toast("رجعت البيانات من النسخة ✓");
    }catch(err){ toast("الملف مش نسخة من الدفتر"); }
    e.target.value="";
  });
  function showNotice(t){ const n=$("#notice"); n.textContent=t; n.hidden=false; }

  // ----- derived -----
  function isLate(x){ return x.status!=="done" && x.due && x.due < today(); }
  function isToday(x){ return x.status!=="done" && x.due && x.due === today(); }
  function sums(arr, pred){
    const m={}; arr.filter(pred).forEach(x=>{ const c=x.cur||"₪"; m[c]=(m[c]||0)+(+x.amount||0); });
    const parts=Object.entries(m).map(([c,v])=>fmtMoney(v,c));
    return parts.length ? parts.join(" + ") : "0 ₪";
  }

  const paySum = o => (o.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
  const paidOf = o => o.status==="done" ? (+o.amount||0) : Math.min(+o.amount||0, paySum(o));
  const remOf = o => o.status==="done" ? 0 : Math.max(0,(+o.amount||0)-paySum(o));
  function mapBy(arr, fn){ const m={}; arr.forEach(x=>{ const c=x.cur||"₪"; m[c]=(m[c]||0)+fn(x); }); return m; }
  function fmtMap(m){ const parts=Object.entries(m).filter(([,v])=>Math.abs(v)>1e-9).map(([c,v])=>fmtMoney(v,c)); return parts.length?parts.join(" + "):"0 ₪"; }
  function receipts(){
    const out=[];
    state.orders.forEach(o=>{
      (o.payments||[]).forEach((p,i)=>!p.fromDeposit && out.push({id:o.id+"-p"+i, oid:o.id, name:o.name, kind:o.kind, service:o.service, cur:o.cur, amount:+p.amount||0, date:p.date, part:true}));
      if(o.status==="done"){ const rest=(+o.amount||0)-paySum(o); if(rest>1e-9) out.push({id:o.id+"-r", oid:o.id, name:o.name, kind:o.kind, service:o.service, cur:o.cur, amount:rest, date:o.paidAt||o.date, part:paySum(o)>0}); }
    });
    state.deposits.filter(d=>d.status!=="returned" && d.received!==false).forEach(d=>out.push({id:d.id+"-d", name:d.name, kind:d.kind, service:d.reason, cur:d.cur, amount:+d.amount||0, date:d.date, dep:d.status||"held"}));
    return out.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  }
  const isHeld = d => (d.status||"held")==="held";
  const heldDeps = () => state.deposits.filter(d=>isHeld(d) && d.received!==false);
  const pendDeps = () => state.deposits.filter(d=>isHeld(d) && d.received===false);
  function signedHtml(m){
    const e=Object.entries(m).filter(([,v])=>Math.abs(v)>1e-9);
    if(!e.length) return "0";
    return e.map(([c,v])=> v<0 ? `<span dir="ltr">-${fmtMoney(-v,c)}</span>` : fmtMoney(v,c)).join(" · ");
  }
  function netMap(ords, debs){
    const m={};
    ords.filter(x=>x.status!=="done").forEach(x=>{ const c=x.cur||"₪"; m[c]=(m[c]||0)+remOf(x); });
    debs.filter(x=>x.status!=="done").forEach(x=>{ const c=x.cur||"₪"; m[c]=(m[c]||0)-(+x.amount||0); });
    return Object.entries(m).filter(([,v])=>Math.abs(v)>1e-9);
  }
  function netHtml(entries, who){
    if(!entries.length) return `<span class="net">خالصين</span>`;
    return entries.map(([c,v])=> v>0
      ? `<span class="net plus">${who?"بدك منه":"إلك"} ${fmtMoney(v,c)}</span>`
      : `<span class="net minus">${who?"بدو منك":"عليك"} ${fmtMoney(-v,c)}</span>`).join(" · ");
  }

  // ----- render -----
  function render(){
    const O=state.orders, D=state.debts;
    $("#sumDue").textContent = fmtMap(mapBy(O.filter(x=>x.status!=="done"), remOf));
    const lateN=O.filter(isLate).length, waitN=O.filter(x=>x.status!=="done").length;
    $("#sumDueSub").textContent = waitN ? `${waitN} قيد${lateN?` · ${lateN} متأخر`:""}` : "ما في حدا عليه إشي";
    const RC=receipts();
    const H=heldDeps(), heldM=mapBy(H, x=>+x.amount||0);
    const inM = mapBy(O, paidOf); Object.entries(heldM).forEach(([c,v])=>inM[c]=(inM[c]||0)+v);
    $("#sumOk").textContent = fmtMap(inM);
    $("#sumOkSub").textContent = `${RC.length} استلام${H.length?` · منها حجوزات ${fmtMap(heldM)}`:""}`;
    $("#cntDeposits").textContent = state.deposits.filter(isHeld).length;
    $("#cntReceipts").textContent = RC.length;
    $("#sumOwe").textContent = sums(D, x=>x.status!=="done");
    const owN=D.filter(x=>x.status!=="done").length, owLate=D.filter(isLate).length;
    $("#sumOweSub").textContent = owN ? `${owN} قيد${owLate?` · ${owLate} فات موعده`:""}` : "ما عليك إشي";
    const cash = {...inM}; Object.entries(mapBy(D, x=>+x.amount||0)).forEach(([c,v])=>cash[c]=(cash[c]||0)-v);
    $("#sumNet").innerHTML = signedHtml(cash);
    const ifAll = {...cash}; Object.entries(mapBy(O, remOf)).forEach(([c,v])=>ifAll[c]=(ifAll[c]||0)+v);
    $("#sumNetSub").innerHTML = `اللي انقبض ناقص كل اللي عليك${H.length?`<br>منها حجوزات لسى ما سلّمتها: ${fmtMap(heldM)}`:""}<br>وإذا الكل دفعلك: ${signedHtml(ifAll)}`;
    $("#cntOrders").textContent = O.filter(x=>x.status!=="done").length;
    $("#cntDebts").textContent = owN;
    $("#cntContacts").textContent = state.contacts.length;
    $("#people").innerHTML = state.contacts.map(c=>`<option value="${esc(c.name)}">${esc(KINDS[kindOf(c)])}${c.phone?" · "+esc(c.phone):""}</option>`).join("");
    $("#filters").hidden = state.tab==="contacts" || state.tab==="receipts";
    document.querySelector('[data-f="late"]').hidden = state.tab==="deposits";
    document.querySelector('[data-f="wait"]').textContent = state.tab==="deposits" ? "لسى ما استلمت" : "لسى";
    document.querySelector('[data-f="done"]').textContent = state.tab==="deposits" ? "استلمت" : "تم";
    $("#addBtn").hidden = state.tab==="receipts";

    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===state.tab));
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.f===state.filter));
    $("#addBtn").textContent = state.tab==="contacts" ? "+ اسم جديد" : "+ قيد جديد";

    const list=$("#list");
    if(state.mode==="loading"){ list.innerHTML=`<div class="empty">جاري التحميل…</div>`; return; }
    const isR = state.tab==="receipts";
    const SRC = isR ? RC : state[state.tab];
    let items=[...SRC];
    const q=state.q.trim().toLowerCase();
    if(q) items=items.filter(x=>[x.name,x.phone,x.email,x.igg,x.service,x.gid,x.reason,x.note,x.platform].join(" ").toLowerCase().includes(q));
    const catsHtml = [["all","الكل"],...Object.entries(KINDS)].map(([k,label])=>{
      const arr = SRC.filter(x=>k==="all"||kindOf(x)===k);
      let sub;
      if(isR) sub = arr.length ? `استلمت: ${fmtMap(mapBy(arr,x=>x.amount))}` : "0 استلام";
      else if(state.tab==="contacts") sub = `${arr.length} اسم`;
      else if(state.tab==="deposits"){ const h=arr.filter(x=>isHeld(x)&&x.received!==false), w=arr.filter(x=>isHeld(x)&&x.received===false); sub = (h.length||w.length) ? [h.length?`استلمت ${fmtMap(mapBy(h,x=>+x.amount||0))}`:"", w.length?`لسى ${fmtMap(mapBy(w,x=>+x.amount||0))}`:""].filter(Boolean).join(" · ") : `${arr.length} حجز`; }
      else { const open=arr.filter(x=>x.status!=="done"); sub = open.length ? `لسى: ${fmtMap(mapBy(open, state.tab==="orders"?remOf:(x=>+x.amount||0)))}` : `${arr.length} قيد`; }
      return `<button class="cat" data-cat="${k}" aria-pressed="${state.cat===k}"><b>${label}</b><span>${sub}</span></button>`;
    }).join("");
    $("#cats").innerHTML = catsHtml;
    if(state.cat!=="all") items=items.filter(x=>kindOf(x)===state.cat);
    const isC = state.tab==="contacts", isD = state.tab==="deposits";
    if(isD && state.filter==="wait") items=items.filter(d=>isHeld(d)&&d.received===false);
    if(isD && state.filter==="done") items=items.filter(d=>d.received!==false);
    if(isD) items.sort((a,b)=>{ const ah=(a.status||"held")==="held", bh=(b.status||"held")==="held"; if(ah!==bh) return ah?-1:1; return (b.created||0)-(a.created||0); });
    if(!isC && !isR && !isD && state.filter==="wait") items=items.filter(x=>x.status!=="done");
    if(!isC && !isR && !isD && state.filter==="done") items=items.filter(x=>x.status==="done");
    if(!isC && !isR && !isD && state.filter==="late") items=items.filter(isLate);
    if(isC) items.sort((a,b)=>String(a.name).localeCompare(String(b.name),"ar"));
    else if(!isR && !isD) items.sort((a,b)=>{
      const ad=a.status==="done", bd=b.status==="done";
      if(ad!==bd) return ad?1:-1;
      if(!ad){ const x=a.due||"9999", y=b.due||"9999"; if(x!==y) return x<y?-1:1; }
      return (b.created||0)-(a.created||0);
    });

    if(!items.length){
      const none = !SRC.length;
      list.innerHTML = none
        ? (isD
          ? `<div class="empty"><img class="elogo" src="${LOGO}" alt=""><b>ما في حجوزات</b>لما حدا يعطيك عربون قبل ما تسلّمه، اضغط «+ قيد جديد» واختار «استلمت حجز».</div>`
          : isR
          ? `<div class="empty"><img class="elogo" src="${LOGO}" alt=""><b>لسى ما استلمت إشي</b>لما تكبس «تم» على قيد، أو تسجل «استلمت دفعة»، بيطلع هون مين دفعلك وقديش ومتى.</div>`
          : isC
          ? `<div class="empty"><img class="elogo" src="${LOGO}" alt=""><b>لسى ما ضفت ولا اسم</b>اضغط «+ اسم جديد» وسجّل التاجر أو الزبون أو واحد من MOHPTON TEAM مع رقم واتسه، وبعدين بتختاره بسرعة لما تسجل طلب.</div>`
          : state.tab==="orders"
          ? `<div class="empty"><img class="elogo" src="${LOGO}" alt=""><b>ما في حدا عليه إلك إشي</b>اضغط «+ قيد جديد»، اختار «بدي منه»، وسجّل الاسم والمبلغ وموعد الدفع.</div>`
          : `<div class="empty"><img class="elogo" src="${LOGO}" alt=""><b>ما عليك إشي لحدا</b>اضغط «+ قيد جديد» واختار «بدو مني» لما تاخد بضاعة أو مصاري من حدا.</div>`)
        : `<div class="empty">ما في نتائج بهاد الفلتر.</div>`;
      return;
    }
    if(isR){
      let lastDay=null;
      list.innerHTML = items.map(r=>{
        const head = r.date!==lastDay ? `<div class="tag" style="align-self:flex-start;font-weight:700">${r.date?fmtDate(r.date):"بدون تاريخ"}</div>` : "";
        lastDay=r.date;
        return head + `<article class="entry">
          <div style="min-width:0"><div class="who">${esc(r.name)}</div>${r.service?`<div class="what">${esc(r.service)}</div>`:""}</div>
          <div class="amt" style="color:var(--ok)">+${esc(fmtMoney(r.amount,r.cur))}</div>
          <div class="meta"><span class="tag k-${kindOf(r)}">${KINDS[kindOf(r)]}</span>${r.dep?`<span class="tag held">حجز${r.dep==="used"?" · صار طلب":""}</span>`:r.part?`<span class="tag part">دفعة</span>`:`<span class="tag">المبلغ كامل</span>`}</div>
        </article>`;
      }).join("");
      return;
    }
    list.innerHTML = items.map(isC?contactCard:isD?depCard:card).join("");
  }

  function waLink(phone, text){
    let d=String(phone||"").replace(/\D/g,"");
    if(!d) return "";
    if(d.startsWith("00")) d=d.slice(2);
    else if(d.startsWith("0")) d="970"+d.slice(1);
    return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
  }

  const norm = s => String(s||"").trim().toLowerCase();
  function findContact(name){ const n=norm(name); return n ? state.contacts.find(c=>norm(c.name)===n) : null; }
  function delBtn(x){
    return state.confirmDel===x.id
      ? `<span class="confirm">أكيد بدك تحذفه؟ <button class="btn btn-danger" data-act="del-yes" data-id="${x.id}">احذف</button><button class="btn btn-ghost" data-act="del-no">لا</button></span>`
      : `<button class="link" data-act="del" data-id="${x.id}">حذف</button>`;
  }
  function depCard(d){
    const st=d.status||"held";
    const recvTag = st==="returned" ? "" : d.received===false ? `<span class="tag late">لسى ما استلمت المصاري</span>` : `<span class="tag part">استلمت المصاري ✓</span>`;
    const stTag = st==="held" ? `<span class="tag held">لسى ما سلّمته</span>` : st==="used" ? `<span class="tag part">صار طلب ✓</span>` : `<span class="tag">رجّعته${d.closedAt?" "+fmtDate(d.closedAt):""}</span>`;
    const ret = state.confirmRet===d.id
      ? `<span class="confirm">رجّعتله ${esc(fmtMoney(d.amount,d.cur))}؟ <button class="btn btn-danger" data-act="ret-yes" data-id="${d.id}">آه رجّعت</button><button class="btn btn-ghost" data-act="ret-no">لا</button></span>`
      : `<button class="link" data-act="ret" data-id="${d.id}">رجّعتله المصاري</button>`;
    return `<article class="entry">
      <div style="min-width:0"><div class="who">${esc(d.name)}</div>${d.reason?`<div class="what">${esc(d.reason)}</div>`:""}</div>
      <div class="amt" style="color:${st==="returned"?"var(--ink-2)":"var(--gold-ink)"}">${esc(fmtMoney(d.amount,d.cur))}</div>
      <div class="meta">
        <span class="tag k-${kindOf(d)}">${KINDS[kindOf(d)]}</span>
        ${d.date?`<span class="tag">تاريخ الحجز ${fmtDate(d.date)}</span>`:""}
        ${recvTag}${stTag}
        ${d.phone?`<span class="tag" dir="ltr">${esc(d.phone)}</span>`:""}
        ${d.email?`<span class="tag" dir="ltr">${esc(d.email)}</span>`:""}${d.igg?`<span class="tag" dir="ltr">IGG ${esc(d.igg)}</span>`:""}
      </div>
      ${d.note?`<div class="note">${esc(d.note)}</div>`:""}
      <div class="row-actions">
        ${st==="held"?`<button class="pill ${d.received===false?"wait":"done"}" data-act="dep-recv" data-id="${d.id}"><span class="dot"></span>${d.received===false?"لسى ما استلمت":"استلمت"}</button><button class="link" style="color:var(--ok);font-weight:700" data-act="dep-order" data-id="${d.id}">حوّله لطلب</button>${d.received===false?"":ret}`:""}
        <span class="spacer"></span>
        <button class="link" data-act="edit" data-id="${d.id}">تعديل</button>
        ${delBtn(d)}
      </div>
    </article>`;
  }
  function contactCard(c){
    const n=norm(c.name);
    const ords=state.orders.filter(o=>norm(o.name)===n), openO=ords.filter(o=>o.status!=="done");
    const debs=state.debts.filter(d=>norm(d.name)===n&&d.status!=="done");
    const lateN=openO.filter(isLate).length;
    const chat = c.phone ? waLink(c.phone, `مرحبا ${c.name||""} 👋`) : "";
    return `<article class="entry${lateN?" late":""}">
      <div style="min-width:0"><div class="who">${esc(c.name)}</div>${[c.phone,c.email,c.igg?"IGG "+c.igg:""].filter(Boolean).map(t=>`<div class="what" dir="ltr" style="text-align:right">${esc(t)}</div>`).join("")}</div>
      <div><span class="tag k-${kindOf(c)}">${KINDS[kindOf(c)]}</span></div>
      <div class="contact-stats">
        <span class="tag" style="background:var(--surface-2)">الجرد: ${netHtml(netMap(openO,debs), true)}</span>
        ${openO.length?`<span class="tag">بدي منه: ${sums(openO,()=>true)}</span>`:""}
        ${debs.length?`<span class="tag">بدو مني: ${sums(debs,()=>true)}</span>`:""}
        ${(()=>{ const h=heldDeps().filter(d=>norm(d.name)===n); return h.length?`<span class="tag held">عنده حجز: ${fmtMap(mapBy(h,x=>+x.amount||0))}</span>`:""; })()}
        ${lateN?`<span class="tag late">${lateN} متأخر</span>`:""}
        <span class="tag">${ords.length+state.debts.filter(d=>norm(d.name)===n).length} قيد</span>
      </div>
      ${c.note?`<div class="note">${esc(c.note)}</div>`:""}
      <div class="row-actions">
        <button class="pill done" data-act="new-orders" data-id="${c.id}">+ بدي منه</button>
        <button class="pill" style="background:var(--late-soft);color:var(--late)" data-act="new-debts" data-id="${c.id}">+ بدو مني</button>
        ${chat?`<a class="link wa" href="${chat}" target="_blank" rel="noopener">واتساب</a>`:""}
        <span class="spacer"></span>
        <button class="link" data-act="edit" data-id="${c.id}">تعديل</button>
        ${delBtn(c)}
      </div>
    </article>`;
  }

  function card(x){
    const isO = state.tab==="orders";
    const done = x.status==="done";
    const late = isLate(x), tdy=isToday(x);
    let dueTag="";
    if(x.due){
      if(done) dueTag=`<span class="tag">الموعد كان ${fmtDate(x.due)}</span>`;
      else if(late) dueTag=`<span class="tag late">متأخر ${daysBetween(x.due,today())} يوم · ${fmtDate(x.due)}</span>`;
      else if(tdy) dueTag=`<span class="tag today">الدفع اليوم</span>`;
      else dueTag=`<span class="tag">${isO?"بيدفع":"لازم أدفع"} ${fmtDate(x.due)} · بعد ${daysBetween(today(),x.due)} يوم</span>`;
    }
    const what = isO ? [x.service, x.platform].filter(Boolean).join(" · ") : (x.reason||"");
    const remind = isO && !done && x.phone ? waLink(x.phone, `مرحبا ${x.name||""} 👋\nتذكير من TARGET COINS STORE بخصوص ${x.service||"طلبك"} بمبلغ ${fmtMoney(remOf(x),x.cur)}${x.due?`، وموعد الدفع ${fmtDate(x.due)}`:""}.\nشكراً إلك 🙏`) : "";
    const del = state.confirmDel===x.id
      ? `<span class="confirm">أكيد بدك تحذفه؟ <button class="btn btn-danger" data-act="del-yes" data-id="${x.id}">احذف</button><button class="btn btn-ghost" data-act="del-no">لا</button></span>`
      : `<button class="link" data-act="del" data-id="${x.id}">حذف</button>`;
    return `<article class="entry${late?" late":""}">
      <div style="min-width:0"><div class="who">${esc(x.name)}</div>${what?`<div class="what">${esc(what)}</div>`:""}</div>
      <div class="amt">${esc(fmtMoney(x.amount,x.cur))}</div>
      <div class="meta">
        <span class="tag k-${kindOf(x)}">${KINDS[kindOf(x)]}</span>
        ${x.date?`<span class="tag">${isO?"انشحن":"تاريخ الدين"} ${fmtDate(x.date)}</span>`:""}
        ${dueTag}
        ${x.gid?`<span class="tag" dir="ltr">ID ${esc(x.gid)}</span>`:""}
        ${x.email?`<span class="tag" dir="ltr">${esc(x.email)}</span>`:""}${x.igg?`<span class="tag" dir="ltr">IGG ${esc(x.igg)}</span>`:""}
        ${x.phone?`<span class="tag" dir="ltr">${esc(x.phone)}</span>`:""}
        ${done&&x.paidAt?`<span class="tag">${isO?"دفع":"سدّيت"} ${fmtDate(x.paidAt)}</span>`:""}
        ${isO&&!done&&paySum(x)>0?`<span class="tag part">دفع ${fmtMoney(paySum(x),x.cur)} · باقي ${fmtMoney(remOf(x),x.cur)}</span>`:""}
      </div>
      ${isO&&state.payFor===x.id?`<div class="payrow"><b>استلمت قديش؟</b><input id="pay-amt" type="number" inputmode="decimal" min="0" step="any" value="${remOf(x)}" aria-label="المبلغ"><input id="pay-date" type="date" value="${today()}" aria-label="التاريخ"><button class="btn btn-gold" data-act="pay-save" data-id="${x.id}">سجّل</button><button class="btn btn-ghost" data-act="pay-no">إلغاء</button></div>`:""}
      ${x.note?`<div class="note">${esc(x.note)}</div>`:""}
      <div class="row-actions">
        <button class="pill ${done?"done":"wait"}" data-act="toggle" data-id="${x.id}" aria-label="غيّر الحالة"><span class="dot"></span>${done?"تم":"لسى"}</button>
        ${isO&&!done&&state.payFor!==x.id?`<button class="link" style="color:var(--ok);font-weight:700" data-act="pay" data-id="${x.id}">استلمت دفعة</button>`:""}
        ${remind?`<a class="link wa" href="${remind}" target="_blank" rel="noopener">ذكّره عالواتس</a>`:""}
        <span class="spacer"></span>
        <button class="link" data-act="edit" data-id="${x.id}">تعديل</button>
        ${del}
      </div>
    </article>`;
  }

  // ----- form -----
  function setStatus(s){ state.status=s; document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===s)); }
  function applyDir(fc){
    state.formColl=fc;
    const isO=fc==="orders", isC=fc==="contacts";
    $("#dirRow").hidden=isC;
    document.querySelectorAll("#dirRow button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.dir===fc));
    $("#formTitle").textContent = isC ? (state.editing?"تعديل الاسم":"اسم جديد") : (state.editing?"تعديل القيد":"قيد جديد");
    const isDep=fc==="deposits";
    $("#l-name").textContent = isC?"الاسم":isO?"مين بدك منه؟":isDep?"مين عطاك الحجز؟":"مين بدو منك؟";
    $("#l-reason").textContent = isDep?"على شو الحجز؟":"على شو؟";
    $("#l-date").textContent = "التاريخ";
    $("#l-due").textContent = isO?"متى وعدك يدفع؟":"متى لازم تدفعله؟";
    $("#l-status").textContent = isO?"دفعلك؟":isDep?"استلمت مصاري الحجز؟":"دفعتله؟";
    document.querySelectorAll(".orders-only").forEach(e=>e.hidden=!isO);
    document.querySelectorAll(".debts-only").forEach(e=>e.hidden=fc!=="debts"&&!isDep);
    document.querySelectorAll(".money-only").forEach(e=>e.hidden=isC);
    document.querySelectorAll(".nodep").forEach(e=>e.hidden=isC||isDep);
    $("#f-amount").required = !isC;
  }
  function openForm(item, coll){
    const fc = coll || state.tab;
    const isC=fc==="contacts";
    state.editing=item&&item.id?item.id:null;
    state.editColl=state.editing?fc:null;
    $("#l-phone").textContent = isC?"رقم الواتس":"رقم الجوال";
    $("#f-name").setAttribute("list", isC?"":"people");
    $("#picked").hidden = true;
    $("#f-kind").value = item ? kindOf(item) : (state.cat!=="all"?state.cat:"customer");
    applyDir(fc);
    const v=item||{};
    $("#f-name").value=v.name||""; $("#f-phone").value=v.phone||""; $("#f-email").value=v.email||""; $("#f-igg").value=v.igg||""; $("#f-service").value=v.service||"";
    $("#f-platform").value=v.platform||""; $("#f-gid").value=v.gid||""; $("#f-reason").value=v.reason||"";
    $("#f-amount").value=v.amount??""; $("#f-cur").value=v.cur||"₪";
    $("#f-date").value=v.date||today(); $("#f-due").value=v.due||""; $("#f-note").value=v.note||"";
    setStatus(fc==="deposits" ? (v.id ? (v.received===false?"wait":"done") : "done") : (v.status||"wait"));
    $("#form").hidden=false; $("#f-name").focus();
    $("#form").scrollIntoView({block:"nearest"});
  }
  function closeForm(){ $("#form").hidden=true; state.editing=null; state.fromDeposit=null; }

  $("#form").addEventListener("submit", async e=>{
    e.preventDefault();
    const coll=state.formColl, isO=coll==="orders";
    if(coll==="contacts"){
      const oldC = state.editing ? state.contacts.find(x=>x.id===state.editing) : null;
      const c = { id: oldC?oldC.id:newId(), created: oldC?.created||Date.now(), kind:$("#f-kind").value,
        name:$("#f-name").value.trim(), phone:$("#f-phone").value.trim(), email:$("#f-email").value.trim(), igg:$("#f-igg").value.trim(), note:$("#f-note").value.trim() };
      if(!c.name){ $("#f-name").focus(); return; }
      const dup = findContact(c.name); if(dup && dup.id!==c.id){ toast("هالاسم موجود من قبل"); return; }
      $("#saveBtn").disabled=true;
      try{ await put("contacts",c); closeForm(); toast("انحفظ الاسم ✓"); }
      catch(err){ toast("ما انحفظ، جرّب كمان مرة"); }
      finally{ $("#saveBtn").disabled=false; }
      return;
    }
    if(coll==="deposits" && !(state.editing && state.editColl!=="deposits")){
      const oldD = state.editing ? state.deposits.find(x=>x.id===state.editing) : null;
      const d = { id: oldD?oldD.id:newId(), created: oldD?.created||Date.now(), kind:$("#f-kind").value,
        name:$("#f-name").value.trim(), phone:$("#f-phone").value.trim(), email:$("#f-email").value.trim(), igg:$("#f-igg").value.trim(), reason:$("#f-reason").value.trim(),
        amount: parseFloat($("#f-amount").value)||0, cur:$("#f-cur").value, date:$("#f-date").value||today(),
        note:$("#f-note").value.trim(), received: state.status==="done", status: oldD?.status||"held", orderId: oldD?.orderId||"", closedAt: oldD?.closedAt||"" };
      if(!d.name){ $("#f-name").focus(); return; }
      $("#saveBtn").disabled=true;
      try{ await put("deposits",d); closeForm(); state.tab="deposits"; render(); toast("انحفظ الحجز ✓"); }
      catch(err){ toast("ما انحفظ، جرّب كمان مرة"); }
      finally{ $("#saveBtn").disabled=false; }
      return;
    }
    if(coll==="deposits"){ toast("القيد هاد ما بيتحوّل لحجز، سجّل حجز جديد"); return; }
    const old = state.editing ? state[state.editColl].find(x=>x.id===state.editing) : null;
    if(old && state.editColl==="deposits"){ toast("الحجز بيتحوّل لطلب من زر «حوّله لطلب»"); return; }
    const moved = old && state.editColl!==coll ? state.editColl : null;
    const item = {
      id: old?old.id:newId(), created: old?.created||Date.now(),
      kind: $("#f-kind").value,
      name: $("#f-name").value.trim(), phone: $("#f-phone").value.trim(), email: $("#f-email").value.trim(), igg: $("#f-igg").value.trim(),
      amount: parseFloat($("#f-amount").value)||0, cur: $("#f-cur").value,
      date: $("#f-date").value, due: $("#f-due").value, note: $("#f-note").value.trim(),
      status: state.status,
    };
    const dep = isO && !old && state.fromDeposit ? state.deposits.find(x=>x.id===state.fromDeposit) : null;
    if(isO){ item.payments = (old && state.editColl==="orders" && old.payments) || [];
      if(dep && dep.received!==false) item.payments=[{amount:+dep.amount||0, date:dep.date||today(), fromDeposit:dep.id}];
      if(item.status!=="done" && paySum(item) >= item.amount - 1e-9 && item.amount>0) item.status="done";
      item.service=$("#f-service").value.trim(); item.platform=$("#f-platform").value; item.gid=$("#f-gid").value.trim(); }
    else { item.reason=$("#f-reason").value.trim(); }
    item.paidAt = item.status==="done" ? (old?.status==="done" && old.paidAt ? old.paidAt : today()) : "";
    if(!item.name){ $("#f-name").focus(); return; }
    $("#saveBtn").disabled=true;
    try{ await put(coll,item); if(moved) await remove(moved, old.id);
      if(dep) await put("deposits",{...dep, status:"used", orderId:item.id, closedAt:today()});
      closeForm(); state.tab=coll; render(); toast(isO?"انحفظ: بدك منه ✓":"انحفظ: بدو منك ✓"); }
    catch(err){ toast(err?.code==="quota_exceeded"?"المساحة امتلت، احذف قيود قديمة":"ما انحفظ، جرّب كمان مرة"); }
    finally{ $("#saveBtn").disabled=false; }
  });
  $("#f-name").addEventListener("input", ()=>{
    if(state.formColl==="contacts") return;
    const c=findContact($("#f-name").value);
    const pk=$("#picked");
    if(c){ if(c.phone) $("#f-phone").value=c.phone; if(c.email) $("#f-email").value=c.email; if(c.igg) $("#f-igg").value=c.igg; $("#f-kind").value=kindOf(c); pk.textContent=`✓ من الأسماء: ${KINDS[kindOf(c)]}`; pk.hidden=false; }
    else pk.hidden=true;
  });
  $("#cancelBtn").addEventListener("click", closeForm);
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>setStatus(b.dataset.s)));
  $("#addBtn").addEventListener("click", ()=>openForm(null));
  document.querySelectorAll("#dirRow button").forEach(b=>b.addEventListener("click",()=>{ applyDir(b.dataset.dir); if(!state.editing) setStatus(b.dataset.dir==="deposits"?"done":"wait"); }));

  // ----- list actions -----
  const busy=new Set();
  $("#list").addEventListener("click", async e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const coll=state.tab, id=b.dataset.id, act=b.dataset.act;
    const item = id && (state[coll]||[]).find(x=>x.id===id);
    if(act==="dep-order" && item){
      state.tab="orders"; state.cat="all"; state.confirmDel=null; render();
      openForm({name:item.name, phone:item.phone, email:item.email, igg:item.igg, kind:kindOf(item), service:item.reason, cur:item.cur, amount:item.amount}, "orders");
      state.fromDeposit=item.id;
      $("#picked").textContent = item.received===false ? `الحجز لسى ما دفعه، فالطلب بينسجل كامل عليه` : `✓ بينخصم من الحجز ${fmtMoney(item.amount,item.cur)}. اكتب سعر الطلب كامل`; $("#picked").hidden=false;
      return;
    }
    if(act==="dep-recv" && item && !busy.has(id)){
      busy.add(id); const r = item.received===false;
      try{ await put("deposits",{...item, received:r}); toast(r?"استلمت الحجز ✓":"رجع: لسى ما استلمت"); }
      catch(err){ toast("ما انحفظ، جرّب كمان مرة"); }
      finally{ busy.delete(id); }
      return;
    }
    if(act==="ret" && item){ state.confirmRet=id; render(); return; }
    if(act==="ret-no"){ state.confirmRet=null; render(); return; }
    if(act==="ret-yes" && item && !busy.has(id)){
      busy.add(id); state.confirmRet=null;
      try{ await put("deposits",{...item, status:"returned", closedAt:today()}); toast("انسجل إنك رجّعت الحجز"); }
      catch(err){ toast("ما انحفظ، جرّب كمان مرة"); }
      finally{ busy.delete(id); render(); }
      return;
    }
    if(act==="pay" && item){ state.payFor=id; render(); const i=$("#pay-amt"); if(i){ i.focus(); i.select(); } return; }
    if(act==="pay-no"){ state.payFor=null; render(); return; }
    if(act==="pay-save" && item && !busy.has(id)){
      const amt=parseFloat($("#pay-amt").value)||0, d=$("#pay-date").value||today();
      if(amt<=0){ $("#pay-amt").focus(); return; }
      busy.add(id);
      const payments=[...(item.payments||[]), {amount:amt, date:d}];
      const full = payments.reduce((a,p)=>a+p.amount,0) >= (+item.amount||0) - 1e-9;
      try{ await put(coll,{...item, payments, status: full?"done":"wait", paidAt: full?d:""}); state.payFor=null; toast(full?"دفع كل المبلغ: تم ✓":`انسجلت الدفعة، باقي ${fmtMoney(Math.max(0,(+item.amount||0)-payments.reduce((a,p)=>a+p.amount,0)),item.cur)}`); render(); }
      catch(err){ toast("ما انحفظ، جرّب كمان مرة"); }
      finally{ busy.delete(id); }
      return;
    }
    if((act==="new-orders"||act==="new-debts") && item){ const to=act.slice(4); state.tab=to; state.cat="all"; state.confirmDel=null; render(); openForm({name:item.name, phone:item.phone, email:item.email, igg:item.igg, kind:kindOf(item)}, to); $("#picked").textContent=`✓ من الأسماء: ${KINDS[kindOf(item)]}`; $("#picked").hidden=false; return; }
    if(act==="toggle" && item && !busy.has(id)){
      busy.add(id);
      const done = item.status!=="done";
      try{ await put(coll,{...item, status:done?"done":"wait", paidAt:done?today():""}); toast(done?"صار: تم ✓":"رجع: لسى"); }
      catch(err){ toast("ما انحفظ، جرّب كمان مرة"); }
      finally{ busy.delete(id); }
    }
    if(act==="edit" && item) openForm(item);
    if(act==="del"){ state.confirmDel=id; render(); }
    if(act==="del-no"){ state.confirmDel=null; render(); }
    if(act==="del-yes" && id){ state.confirmDel=null; try{ await remove(coll,id); toast("انحذف"); }catch(err){ toast("ما انحذف، جرّب كمان مرة"); } }
  });

  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ state.tab=t.dataset.tab; state.confirmDel=null; state.payFor=null; state.confirmRet=null; closeForm(); render(); }));
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ state.filter=c.dataset.f; render(); }));
  $("#cats").addEventListener("click", e=>{ const c=e.target.closest("[data-cat]"); if(!c) return; state.cat=c.dataset.cat; render(); });
  $("#q").addEventListener("input", e=>{ state.q=e.target.value; render(); });

  init();
})();
</script>

</body></html>
